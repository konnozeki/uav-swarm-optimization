name: static-study

on:
  pull_request:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Run static report-suite smoke study
        run: |
          python run_static_sota_suite.py --profile smoke --skip-exact --no-plots --output-dir outputs/static_sota_suite
      - uses: actions/upload-artifact@v4
        with:
          name: static-sota-suite-smoke
          path: outputs/static_sota_suite
